# Render Blueprint: one web service (Next.js + Socket.IO, Docker) + PostgreSQL.
# Render dashboard → New → Blueprint → pick this repo/branch.
# plan: free sleeps after ~15 min idle; change the web plan to "starter" for always-on.
services:
  - type: web
    name: math-bro
    runtime: docker
    plan: free
    branch: claude/math-bro-amath-game-y8emx9
    autoDeploy: true
    healthCheckPath: /api/auth/me
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: math-bro-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true

databases:
  - name: math-bro-db
    plan: free
    databaseName: mathbro
    user: mathbro
